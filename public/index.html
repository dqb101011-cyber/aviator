<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🛫 Aviator Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <h1>🛫 AVIATOR</h1>
  <p class="subtitle">Game cá cược máy bay</p>

  <div id="step1">
    <div class="form-group">
      <label>ID Zalo của bạn:</label>
      <input type="text" id="userId" placeholder="VD: 630bbffafbad12f34bbc">
      <small>💡 Gõ .id trong Zalo bot để lấy ID</small>
    </div>
    <button onclick="checkUser()">➡️ TIẾP TỤC</button>
  </div>

  <div id="step2-create" style="display:none">
    <p style="text-align:center; color:#ff0066; margin-bottom:15px;">
      🎉 Chào mừng <span id="welcome-name"></span>!<br>Bạn là người mới, hãy tạo mật khẩu.
    </p>
    <div class="form-group">
      <label>Mật khẩu mới:</label>
      <input type="password" id="newPassword" placeholder="Có chữ HOA + số">
      <small>⚠️ Ít nhất 6 ký tự, có 1 chữ IN HOA và 1 chữ số</small>
    </div>
    <div class="form-group">
      <label>Nhập lại mật khẩu:</label>
      <input type="password" id="newPassword2" placeholder="Nhập lại">
    </div>
    <button onclick="createPassword()">✅ TẠO MẬT KHẨU</button>
  </div>

  <div id="step2-login" style="display:none">
    <div class="form-group">
      <label>Mật khẩu:</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu">
    </div>
    <button onclick="login()">🔓 ĐĂNG NHẬP</button>
    <button class="btn-secondary" onclick="showForgot()">❓ Quên mật khẩu?</button>
  </div>

  <div id="step3-forgot" style="display:none">
    <p style="text-align:center; color:#ffcc00; margin-bottom:15px;">🔐 Đổi mật khẩu mới</p>
    <button onclick="sendOTP()">📤 GỬI OTP QUA ZALO</button>
    <div id="otp-section" style="display:none">
      <div class="form-group">
        <label>Mã OTP:</label>
        <input type="text" id="otpInput" placeholder="6 chữ số" maxlength="6">
      </div>
      <div class="form-group">
        <label>Mật khẩu mới:</label>
        <input type="password" id="resetPassword" placeholder="Có chữ HOA + số">
      </div>
      <div class="form-group">
        <label>Nhập lại mật khẩu mới:</label>
        <input type="password" id="resetPassword2" placeholder="Nhập lại">
      </div>
      <button onclick="resetPassword()">✅ ĐỔI MẬT KHẨU</button>
    </div>
    <button class="btn-secondary" onclick="backToLogin()">⬅️ Quay lại</button>
  </div>

  <p id="error-msg" class="error"></p>
</div>

<div id="game-screen" class="screen" style="display:none">
  <div class="header">
    <div>
      <span id="user-name">-</span>
      <button class="btn-logout" onclick="logout()">Thoát</button>
    </div>
    <div id="user-balance">0 VNĐ</div>
  </div>

  <div id="crash-history">
    <div id="crash-history-list"></div>
  </div>

  <div id="game-area">
    <canvas id="game-canvas"></canvas>
    <div id="multiplier-display">1.00x</div>
    <div id="status-display"></div>
  </div>

  <div id="streak-box" style="display:none">
    🔥 Streak: <span id="streak-count">0</span> | 
    🏆 Best: <span id="best-streak">0</span>
  </div>

  <div class="controls">
    <input type="number" id="bet-amount" placeholder="Số tiền" value="10000" step="1000">
    <button id="start-btn" onclick="startGame()">🚀 BẮT ĐẦU</button>
    <button id="cashout-btn" class="btn-cashout" onclick="cashout()" style="display:none">💰 LẤY TIỀN</button>
  </div>

  <div id="quests-box">
    <h3>🎯 NHIỆM VỤ HÀNG NGÀY</h3>
    <div id="quests-list"></div>
  </div>

  <div id="history-box">
    <h3>📜 Lịch sử gần đây</h3>
    <div id="history-list"></div>
  </div>

  <div id="chat-box">
    <h3>💬 Chat</h3>
    <div id="chat-messages"></div>
    <div id="chat-input-box">
      <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." maxlength="200">
      <button onclick="sendChat()">📤</button>
    </div>
  </div>
</div>

<script src="game.js"></script>
<script src="game2.js"></script>
</body>
</html>
